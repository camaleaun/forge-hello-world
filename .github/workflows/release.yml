name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      forge-ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned forge ref
        id: ref
        run: echo "ref=$(cat .forge-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: camaleaun/forge
          ref: ${{ steps.ref.outputs.ref }}
          path: forge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the package version
        id: version
        run: echo "version=$(forge/bin/forge info --field version)" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(forge/bin/forge info --field version)"
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact: dist-macos
          - os: ubuntu-24.04
            target: linux
            artifact: dist-linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux
            artifact: dist-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: camaleaun/forge
          ref: ${{ needs.check.outputs.forge-ref }}
          path: forge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the packages the tests build with (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ pkg-config libgtk-4-dev libsoup-3.0-dev glib-networking
      - name: Test
        run: npm test
        env:
          FORGE_HOME: ${{ github.workspace }}/forge
      # Build, sign (optional), package and upload the dist artifact. Without signing inputs the app is signed ad-hoc.
      - uses: camaleaun/forge-action@v1.2.0
        with:
          target: ${{ matrix.target }}
          artifact-name: ${{ matrix.artifact }}
          forge-ref: ${{ needs.check.outputs.forge-ref }}
          macos-certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          macos-certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          macos-signing-identity: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}

  # Runs on dry runs too, so a broken manifest or a language pack that differs between builds shows up before a tag.
  manifest:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: camaleaun/forge
          ref: ${{ needs.check.outputs.forge-ref }}
          path: forge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-parts
      - name: Merge the artifacts and compare the language packs
        run: |
          mkdir dist
          for pack in dist-parts/*/*.lang; do
            name="$(basename "$pack")"
            if [ -e "dist/$name" ] && [ "$(sha256sum < "dist/$name")" != "$(sha256sum < "$pack")" ]; then
              echo "$name differs between builds" >&2
              exit 1
            fi
            cp "$pack" "dist/$name"
          done
          for file in dist-parts/*/*; do
            case "$file" in *.lang) ;; *) cp "$file" dist/ ;; esac
          done
          ls -l dist
      - name: Write and check latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          forge/bin/forge manifest --dir dist --tag "v${VERSION}" --repo "$GITHUB_REPOSITORY" > latest.json
          for platform in darwin-arm64 linux-x86_64 linux-arm64; do
            grep -q "\"$platform\"" latest.json || { echo "latest.json has no $platform" >&2; exit 1; }
          done
          cat latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: latest.json

  # Installs the real packages in clean containers and runs the installed app (also on a dry run, before anything is published).
  packages:
    needs: [check, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist
      - name: Install the .deb on Ubuntu 24.04 and run the installed app
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/hello-forge-*-linux-*.deb
            hello-forge --version
            test "$(hello-forge --greet)" = "Hello, world!"
            pack="$(ls /dist/hello-forge-*-pt-BR.lang)"
            sha="$(sha256sum "$pack" | cut -c1-12)"
            mkdir -p /tmp/cache
            cp "$pack" "/tmp/cache/pt-BR-$sha.lang"
            test "$(FORGE_I18N_CACHE_DIR=/tmp/cache hello-forge --locale pt-BR --greet)" = "Olá, mundo!"
          '
      - name: Install the .rpm on Fedora 41 and run the installed app
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:41 bash -euc '
            dnf install -y -q /dist/hello-forge-*-linux-*.rpm
            hello-forge --version
            test "$(hello-forge --greet)" = "Hello, world!"
            pack="$(ls /dist/hello-forge-*-pt-BR.lang)"
            sha="$(sha256sum "$pack" | cut -c1-12)"
            mkdir -p /tmp/cache
            cp "$pack" "/tmp/cache/pt-BR-$sha.lang"
            test "$(FORGE_I18N_CACHE_DIR=/tmp/cache hello-forge --locale pt-BR --greet)" = "Olá, mundo!"
          '

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, manifest, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release command needs a repository to run in.
      - uses: actions/checkout@v4
      - uses: camaleaun/forge-action/publish@v1.2.0
        with:
          forge-ref: ${{ needs.check.outputs.forge-ref }}
          pattern: dist-*
