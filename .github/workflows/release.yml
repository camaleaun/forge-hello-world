name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    # Signing is optional: without these secrets the app is signed ad-hoc and nothing is notarized.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned forge ref
        id: ref
        run: echo "ref=$(cat .forge-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: camaleaun/forge
          ref: ${{ steps.ref.outputs.ref }}
          path: forge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: npm test
        env:
          FORGE_HOME: ${{ github.workspace }}/forge
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(forge/bin/forge info --field version)"
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Import the signing certificate (skipped without secrets)
        run: forge/scripts/macos-sign.sh import-certificate
      - name: Generate sources
        run: forge/bin/forge build --strict-i18n --out build/src
      - name: Build
        run: |
          cmake -S build/src -B build/out -DCMAKE_BUILD_TYPE=Release
          cmake --build build/out
      - name: Sign, notarize and staple the app (ad-hoc signature without secrets)
        run: |
          forge/scripts/macos-sign.sh sign build/out/hello-forge.app
          forge/scripts/macos-sign.sh notarize build/out/hello-forge.app
          forge/scripts/macos-sign.sh staple build/out/hello-forge.app
      - name: Package
        run: |
          version="$(forge/bin/forge info --field version)"
          mkdir -p dist
          forge/scripts/macos-dmg.sh build/out/CPackConfig.cmake build/cpack hello-forge
          mv build/cpack/hello-forge-*.dmg "dist/hello-forge-${version}-darwin-arm64.dmg"
          forge/scripts/macos-sign.sh sign "dist/hello-forge-${version}-darwin-arm64.dmg"
          forge/scripts/macos-sign.sh notarize "dist/hello-forge-${version}-darwin-arm64.dmg"
          forge/scripts/macos-sign.sh staple "dist/hello-forge-${version}-darwin-arm64.dmg"
          ditto -c -k --keepParent build/out/hello-forge.app "dist/hello-forge-${version}-darwin-arm64.zip"
          # Language packs ship next to the app; the app downloads the one it needs from this release.
          cp build/src/lang/*.lang dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.lang

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned forge ref
        id: ref
        run: echo "ref=$(cat .forge-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: camaleaun/forge
          ref: ${{ steps.ref.outputs.ref }}
          path: forge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Write latest.json
        run: forge/bin/forge manifest --dir dist --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/* latest.json --generate-notes $flags
